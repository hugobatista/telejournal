[project]
name = "telejournal"
version = "0.0.3"
description = "Telegram bot that journals private messages into an Obsidian vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "PyYAML>=6.0",
    "aiofiles>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "types-aiofiles>=24.1.0.20241221",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
telejournal = "telejournal.main:run"

[tool.uv]
exclude-newer = "30 days"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telejournal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/telejournal"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
files = ["src"]
exclude = ["tests/"]

