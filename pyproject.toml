[project]
name = "telejournal"
version = "0.1.1"
description = "Telegram bot that journals private messages into an Obsidian vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "PyYAML>=6.0",
    "aiofiles>=24.0",
]
authors = [
    { name = "Hugo Batista <code at hugobatista.com>" },
]

[dependency-groups]
lint = [
    "mypy>=1.10",
    "ruff>=0.1.0",
    "types-aiofiles>=24.1.0.20241221",
    "types-PyYAML>=6.0.12.20240917",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
dev = [
    "hatch>=1.16.5",
    {include-group = "lint"},
    {include-group = "test"},
]

[project.scripts]
telejournal = "telejournal.main:run"

[tool.uv]
required-version = "0.11.18"
exclude-newer = "30 days"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telejournal"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
lint-check = "ruff check ."
format-check = "ruff format --check ."
test = "pytest"
typecheck = "mypy"
validate = ["lint", "format", "test", "typecheck"]
check = ["lint-check", "format-check", "test", "typecheck"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/telejournal"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.mypy]
python_version = "3.11"
strict = true
incremental = false
check_untyped_defs = true
files = ["src"]
exclude = ["tests/"]

